# Builds the site with Hugo and publishes the result to the `built` branch.
#
# The VPS never talks to GitHub Actions directly. GitHub Actions runners are
# blocked from reaching the VPS by something at the hosting provider's network
# edge — confirmed by testing: even a plain HTTP request on port 80 times out
# from a runner, not just SSH on port 22, and this is outside anything
# `firewalld` or the provider's own visible firewall panel controls.
#
# So this workflow only builds and publishes static output to a branch in
# this repository. The VPS pulls that branch on its own, on a timer — an
# outbound connection it initiates, which is unaffected by whatever is
# blocking the reverse direction. See deploy/poll-and-publish.sh and
# deploy/README.md for the VPS side.

name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows a manual re-run from the Actions tab

permissions:
  contents: write # needed to push the built output to the `built` branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # the Relearn theme is a submodule
          fetch-depth: 0 # enableGitInfo needs full history for page dates

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0' # keep in sync with the version used locally
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Publish to the built branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # provided automatically, no setup needed
          publish_dir: ./public
          publish_branch: built
          # The built branch is disposable generated output, not history worth
          # keeping — force_orphan keeps it as a single commit each run rather
          # than accumulating a full commit per deploy forever.
          force_orphan: true
