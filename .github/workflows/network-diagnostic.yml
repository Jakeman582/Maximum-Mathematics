# TEMPORARY — re-checking whether GitHub Actions runners can reach the VPS at
# all, this time with the IP hardcoded directly rather than read from the
# VPS_HOST secret. The original test that found "Connection timed out" on
# both port 80 and port 22 used the secret, and there's a real chance that
# secret was typo'd the same way the webhook's payload URL briefly was
# (185.28.20.60 instead of 185.28.23.60) — which would have made that result
# meaningless. This settles it either way. Delete this file once answered.

name: VPS network diagnostic (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test reachability to the VPS (IP hardcoded, not from a secret)
        run: |
          echo "=== HTTP (port 80) ==="
          curl -v -m 10 "http://185.28.23.60/" || echo "HTTP FAILED"
          echo "=== raw TCP to port 22 ==="
          timeout 10 bash -c "echo > /dev/tcp/185.28.23.60/22" \
            && echo "TCP 22: OK" || echo "TCP 22: FAILED"
