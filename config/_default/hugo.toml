# Core site configuration for Maximum Mathematics.
#
# Environment-specific overrides live in sibling directories under `config/`
# (for example `config/production/`), which Hugo merges on top of this file.

# Used for local `hugo server` and as a fallback; the GitHub Pages workflow
# (.github/workflows/hugo.yml) overrides this at build time with `--baseURL`,
# set to whatever URL Pages is actually serving from (its default
# username.github.io/repo/ path, or a custom domain once one is configured).
baseURL = 'https://maximummathematics.com/'
title = 'Maximum Mathematics'
locale = 'en-US'
defaultContentLanguage = 'en'

theme = 'hugo-theme-relearn'

# Surfaces a "last modified" date on every page from the commit that last
# touched it. Requires the checkout to have full history (`fetch-depth: 0` in
# the workflow) — a shallow clone has no per-file commit dates to read.
enableGitInfo = true

enableRobotsTXT = true

# `print` gives every chapter and page a printable single-file version, which
# matters for textbook chapters and problem sets that readers want on paper.
[outputs]
  home    = ['html', 'rss', 'print']
  section = ['html', 'rss', 'print']
  page    = ['html', 'print']
