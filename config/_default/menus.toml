# Links shown below the page tree in the sidebar. Content sections generate
# their own entries automatically; only additions belong here.
#
# Internal destinations use `pageRef`, not `url`, so Hugo resolves them against
# the content tree and fails the build if the target ever moves.
#
# /books, /asymptote, and /style-guide are all marked `hidden = true` in their
# own front matter, which keeps them out of the main sidebar tree except while
# actually browsing inside them — these shortcuts are the only entry point
# into any of them from elsewhere on the site.
#
# The "Books" entry below has an explicit identifier — layouts/partials/
# _relearn/menuTitle.gotmpl looks it up by that identifier to swap its label
# for the current book's own title while browsing inside one.

[[shortcuts]]
  identifier = 'books'
  name = '<i class="fa-fw fas fa-book"></i> Books'
  pageRef = '/books'
  weight = 10

[[shortcuts]]
  name = '<i class="fa-fw fas fa-draw-polygon"></i> Asymptote Library'
  pageRef = '/asymptote'
  weight = 20

[[shortcuts]]
  name = '<i class="fa-fw fas fa-palette"></i> Style Guide'
  pageRef = '/style-guide'
  weight = 30
