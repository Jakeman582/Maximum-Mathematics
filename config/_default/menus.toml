# Links shown below the page tree in the sidebar. Content sections generate
# their own entries automatically; only additions belong here.
#
# Internal destinations use `pageRef`, not `url`, so Hugo resolves them against
# the content tree and fails the build if the target ever moves.
#
# Both /books and /asymptote are marked `hidden = true` in their own front
# matter, which keeps them out of the main sidebar tree except while actually
# browsing inside them — these shortcuts are the only entry point into either
# from elsewhere on the site.

[[shortcuts]]
  name = '<i class="fa-fw fas fa-book"></i> Books'
  pageRef = '/books'
  weight = 10

[[shortcuts]]
  name = '<i class="fa-fw fas fa-draw-polygon"></i> Asymptote Library'
  pageRef = '/asymptote'
  weight = 20
