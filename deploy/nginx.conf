# nginx site configuration for Maximum Mathematics.
#
# CentOS's nginx package includes every file under /etc/nginx/conf.d/*.conf
# directly — there is no sites-available/sites-enabled step here, unlike on
# Debian/Ubuntu. Copy this to /etc/nginx/conf.d/maximum-mathematics.conf,
# replace the domain, then run certbot to add TLS — it rewrites this file in
# place and adds the HTTPS listener and redirect.

server {
    listen 80;
    listen [::]:80;

    # `_` matches any hostname — appropriate while testing over the VPS's bare
    # IP with no domain pointed at it yet. Once DNS is wired up (see step 9 in
    # deploy/README.md), replace this with the real domain before running
    # certbot: certbot's nginx plugin matches on server_name, and a catch-all
    # here would make it ambiguous which block to add TLS to.
    server_name _;

    # Owned entirely by the `deploy` user; nginx only needs read access. See
    # deploy/README.md for how this directory is populated — nginx never
    # writes here itself.
    root /srv/maximum-mathematics/www;
    index index.html;

    charset utf-8;

    # Hugo writes a directory per page, so a request for /asymptote/ must find
    # /asymptote/index.html; the 404 is Hugo's own generated page.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Fingerprinted assets are immutable: a changed file gets a changed name.
    location ~* \.(css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Figures are not fingerprinted — they keep a stable filename across
    # re-renders — so they get a short cache with revalidation instead.
    location ~* \.(svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # The webhook listener, bound to loopback on the VPS. This location is the
    # only way to reach it — see deploy/hooks.json and deploy/README.md.
    location /hooks/ {
        proxy_pass http://127.0.0.1:9000/hooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A publish check can take a few seconds (git fetch, copy, swap);
        # nginx's default 60s read timeout is generous enough already, but
        # this makes the margin explicit rather than relying on the default.
        proxy_read_timeout 90s;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
